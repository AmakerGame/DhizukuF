name: Build

on:
  push:
    paths-ignore:
      - docs/**
      - fastlane/**
      - LICENSE
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build dish client (dex)
        # Rebuilds dish_dhizukuf.dex from dish-client/src with d8. If anything fails, the committed dex
        # is kept. Set the repository variable DISH_REBUILD_DEX to "false" to always use the committed file.
        if: ${{ vars.DISH_REBUILD_DEX != 'false' }}
        continue-on-error: true
        run: sh dish-client/build.sh

      - name: Set environments
        run: |
          {
            echo "repo=$(echo ${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/})"
            echo "version=v$(grep versionName version.properties | awk -F\= '{print $2}')"
            echo "commit=$(echo ${{ github.sha }} | cut -c-7)"
          } >> $GITHUB_ENV

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --warning-mode=all assembleRelease
          cp -f app/build/outputs/apk/release/app-release.apk ${{ env.repo }}-${{ env.version }}@${{ env.commit }}.apk

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.repo }}-${{ env.version }}@${{ env.commit }}
          path: ${{ env.repo }}-${{ env.version }}@${{ env.commit }}.apk
